# Bygger norsk-varianten (app.marmalade.stt.norsk, arm64) usignert. Rafiki henter, signerer og
# installerer den med tools/norsk/signer.sh, så signeringsnøkkelen aldri forlater Rafiki.
name: APK (norsk)

on:
  workflow_dispatch:
  push:
    branches: [norsk]
    paths:
      - "app/**"
      - "textproc/**"
      - "third_party/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/apk-norsk.yml"

permissions:
  contents: read

concurrency:
  group: apk-norsk
  cancel-in-progress: true

jobs:
  bygg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK-pakker (NDK og CMake som BUILDING.md krever)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-36" >/dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Bygg
        run: ./gradlew --no-daemon -PabiFilters=arm64-v8a -PnativeJobs=4 :app:assembleNorskRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apk-norsk
          path: app/build/outputs/apk/norsk/release/*.apk
          if-no-files-found: error

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Enhetstester (norsk-varianten)
        run: ./gradlew --no-daemon :app:testNorskDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: testrapport
          path: app/build/reports/tests/
